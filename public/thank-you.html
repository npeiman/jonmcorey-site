<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You — Professional Advisory Group</title>
<link rel="stylesheet" href="/css/styles.css">
<body data-page="">
<div id="site-header"></div>

<section class="block">
  <div class="container narrow">
    <div class="card text-center" id="box">
      <div style="font-size:3rem;" id="icon">✓</div>
      <h1 id="title" style="margin-top:10px;">Thank You</h1>
      <p id="message" class="muted" style="font-size:1.1rem;"></p>
      <p id="submessage" class="muted"></p>
      <div class="mt-2" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="/" class="btn btn-navy">Return Home</a>
        <a href="/calendar" class="btn btn-outline">Back to Calendar</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="/js/layout.js"></script>
<script>
(function () {
  var status = new URLSearchParams(location.search).get("status") || "reserved";
  var icon = document.getElementById("icon");
  var title = document.getElementById("title");
  var msg = document.getElementById("message");
  var sub = document.getElementById("submessage");
  if (status === "paid") {
    icon.textContent = "✓"; icon.style.color = "var(--ok)";
    title.textContent = "Payment Received — You're Booked!";
    msg.textContent = "Thank you. Your one-hour session with Rev. Jon M. Corey is confirmed and paid.";
    sub.textContent = "A confirmation email is on its way to you, and Rev. Corey has been notified.";
  } else if (status === "cancelled") {
    icon.textContent = "↩"; icon.style.color = "var(--gold-dark)";
    title.textContent = "Checkout Cancelled";
    msg.textContent = "No payment was taken and your time was not reserved.";
    sub.textContent = "You're welcome to choose another time whenever you're ready.";
  } else {
    icon.textContent = "✓"; icon.style.color = "var(--ok)";
    title.textContent = "Your Session Is Reserved";
    msg.textContent = "Thank you. Your requested time has been reserved.";
    sub.textContent = "A confirmation email is on its way, and Rev. Corey's office will follow up with any details.";
  }
})();
</script>
</body>
