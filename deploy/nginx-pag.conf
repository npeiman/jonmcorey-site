# nginx reverse proxy for the Professional Advisory Group site.
# Copy to /etc/nginx/sites-available/pag, edit the server_name values,
# symlink into sites-enabled, test, and reload. Certbot will add the
# HTTPS (443) blocks automatically when you run it (see DEPLOY.md).

# ---- Production ----
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;          # e.g. professionaladvisorygroup.com www.professionaladvisorygroup.com

    # Optional: allow larger form posts
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ---- Development (optional) ----
